<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Melomango app icon: a ripe mango with a music note. Source for `npx tauri icon app-icon.svg`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#ffd596"/>
    </linearGradient>
    <radialGradient id="mango" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffe36b"/>
      <stop offset="0.45" stop-color="#ffaa22"/>
      <stop offset="1" stop-color="#ec5f00"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8f3a"/>
      <stop offset="1" stop-color="#7fd36b"/>
    </linearGradient>
  </defs>

  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#bg)"/>

  <!-- soft shadow -->
  <ellipse cx="520" cy="872" rx="250" ry="34" fill="#b85600" opacity="0.16"/>

  <g transform="rotate(-18 512 580)">
    <!-- mango -->
    <path d="M512 262
             C 712 262 806 438 796 616
             C 786 800 650 878 506 878
             C 344 878 236 770 246 606
             C 254 480 330 440 362 372
             C 394 300 442 262 512 262 Z"
          fill="url(#mango)"/>
    <!-- highlight -->
    <ellipse cx="412" cy="440" rx="74" ry="38" fill="#fff" opacity="0.35" transform="rotate(-40 412 440)"/>
  </g>

  <!-- stem -->
  <path d="M470 286 C 466 246 476 214 498 190" fill="none" stroke="#7a4a24" stroke-width="24" stroke-linecap="round"/>
  <!-- leaf -->
  <path d="M492 214 C 548 112 676 82 780 122 C 732 222 626 268 492 214 Z" fill="url(#leaf)"/>
  <path d="M520 206 C 600 176 668 152 736 134" fill="none" stroke="#256f2e" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- music note -->
  <g fill="#fff">
    <rect x="534" y="430" width="34" height="270" rx="17"/>
    <path d="M552 432 C 640 452 690 512 664 594 C 650 548 612 520 560 514 Z"/>
    <ellipse cx="496" cy="700" rx="78" ry="58" transform="rotate(-22 496 700)"/>
  </g>
</svg>
