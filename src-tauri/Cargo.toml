[package]
name = "melomango"
version = "0.13.0"
description = "Reproductor de música en streaming gratuito"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "melomango_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
unicode-normalization = "0.1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "process", "time", "macros", "net", "io-util", "fs"] }
async-trait = "0.1"
anyhow = "1"
percent-encoding = "2"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
# Job objects: a plugin and everything it starts end together (sources/plugin.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
